[package]
name = "fid"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
chrono-tz = "0.10"
sha2 = "0.10"
url = "2"
feed-rs = "2"
scraper = { version = "0.24", default-features = false }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
rusqlite = { version = "0.38", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt", "time", "net"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
