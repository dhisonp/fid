[package]
name = "fid"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "=0.8.7", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
chrono-tz = "0.10"
sha2 = "0.10"
url = "2"
feed-rs = "2"
scraper = { version = "0.24", default-features = false }
futures-util = "0.3"
js-sys = "0.3"
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# feed-rs uses UUIDs; Workers provide randomness through the JavaScript runtime.
uuid = { version = "1", features = ["js"] }
